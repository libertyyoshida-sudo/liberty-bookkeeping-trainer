<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Liberty Bookkeeping Trainer | 新規登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg-main: #f5f7fb;
      --bg-card: #ffffff;
      --primary: #005bac;
      --primary-soft: #e2eef9;
      --accent: #00a0e9;
      --text-main: #222;
      --text-muted: #666;
      --danger: #d9534f;
      --success: #28a745;
      --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.06);
      --radius-xl: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top left, #e6f0ff, #f5f7fb 40%, #ffffff 80%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 24px 22px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(0,0,0,0.03);
    }

    h1 {
      font-size: 1.3rem;
      margin: 0 0 4px;
      color: var(--primary);
      text-align: center;
    }

    p.sub {
      margin: 0 0 18px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .password-wrapper {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    select {
      width: 100%;
      padding: 8px 10px;
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid #dde3f0;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
    }

    .password-wrapper input[type="password"],
    .password-wrapper input[type="text"] {
      padding-right: 40px;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .toggle-password:hover {
      color: var(--primary);
    }

    .toggle-password:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 4px;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 91, 172, 0.18);
    }

    .helper {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .error {
      font-size: 0.78rem;
      color: var(--danger);
      margin-top: 4px;
    }

    .success {
      font-size: 0.82rem;
      color: var(--success);
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      border-radius: 999px;
      border: none;
      padding: 9px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      margin-top: 4px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 91, 172, 0.35);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    .footer-link {
      margin-top: 14px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .footer-link a {
      color: var(--primary);
      text-decoration: none;
    }

    .footer-link a:hover { text-decoration: underline; }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 1200;
      display: flex;
      justify-content: flex-end;
      padding: 8px 16px;
      width: 100%;
    }
    .lang-toggle {
      display: inline-flex;
      border-radius: 999px;
      padding: 2px;
      background: var(--primary-soft);
    }
    .lang-toggle button {
      border: none;
      padding: 4px 10px;
      border-radius: 999px;
      background: transparent;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
    }
    .lang-toggle button.active {
      background: #fff;
      color: var(--primary);
      font-weight: 600;
      box-shadow: 0 0 0 1px rgba(0, 91, 172, 0.06);
    }
  </style>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const LANG_STORAGE_KEY = 'liberty-lang';
    const AUTH_I18N = {
      ja: {
        h1: '新規登録',
        sub: 'Liberty Bookkeeping Trainer を利用するためのアカウントを作成します。',
        'label-email': 'メールアドレス',
        'label-password': 'パスワード',
        'pw-helper': '条件：8文字以上・英大文字・英小文字・数字・記号を各1文字以上含めてください。',
        'label-password-confirm': 'パスワード（確認）',
        'label-nationality': '国籍（任意）',
        'nationality-helper': '任意項目です。留学生の分析などに利用します。',
        submit: 'アカウントを作成する',
        'footer-have-account': 'すでにアカウントをお持ちの方は',
        'footer-login-link': 'ログイン画面へ',
        'pw-show': 'パスワードを表示',
        'pw-hide': 'パスワードを非表示',
        'pw-ok': '安全なパスワードです。',
        'pw-missing-prefix': '不足: ',
        'pw-lengthOK': '8文字以上',
        'pw-hasUpper': '英大文字',
        'pw-hasLower': '英小文字',
        'pw-hasNumber': '数字',
        'pw-hasSymbol': '記号',
        'pw-confirm-match': '一致しています。',
        'pw-confirm-mismatch': 'パスワードが一致しません。',
        'err-required': 'メールアドレスとパスワードを入力してください。',
        'err-pw-mismatch': 'パスワードと確認用パスワードが一致しません。',
        'err-pw-weak': 'パスワード条件を満たしていません。ヒントを確認してください。',
        'err-signup-failed': '登録に失敗しました: ',
        'err-no-user': 'ユーザー情報の取得に失敗しました。',
        'err-profile-failed': '登録は完了しましたが、プロフィール保存でエラーが発生しました。',
        'err-autologin-failed': '登録は完了しましたが自動ログインに失敗しました: ',
        'err-unknown': '不明なエラーが発生しました。'
      },
      en: {
        h1: 'Sign Up',
        sub: 'Create an account to use Liberty Bookkeeping Trainer.',
        'label-email': 'Email address',
        'label-password': 'Password',
        'pw-helper': 'Requirements: at least 8 characters, including an uppercase letter, a lowercase letter, a number, and a symbol.',
        'label-password-confirm': 'Password (confirm)',
        'label-nationality': 'Nationality (optional)',
        'nationality-helper': 'Optional. Used for analysis such as international student statistics.',
        submit: 'Create account',
        'footer-have-account': 'Already have an account?',
        'footer-login-link': 'Go to login',
        'pw-show': 'Show password',
        'pw-hide': 'Hide password',
        'pw-ok': 'This is a secure password.',
        'pw-missing-prefix': 'Missing: ',
        'pw-lengthOK': 'at least 8 characters',
        'pw-hasUpper': 'an uppercase letter',
        'pw-hasLower': 'a lowercase letter',
        'pw-hasNumber': 'a number',
        'pw-hasSymbol': 'a symbol',
        'pw-confirm-match': 'Passwords match.',
        'pw-confirm-mismatch': 'Passwords do not match.',
        'err-required': 'Please enter your email address and password.',
        'err-pw-mismatch': 'Password and confirmation do not match.',
        'err-pw-weak': 'Password does not meet the requirements. Please check the hint.',
        'err-signup-failed': 'Sign up failed: ',
        'err-no-user': 'Failed to retrieve user information.',
        'err-profile-failed': 'Sign up completed, but saving your profile failed.',
        'err-autologin-failed': 'Sign up completed, but automatic login failed: ',
        'err-unknown': 'An unknown error occurred.'
      }
    };

    function getLang() {
      const saved = localStorage.getItem(LANG_STORAGE_KEY);
      return saved === 'en' ? 'en' : 'ja';
    }

    function t(key) {
      return AUTH_I18N[getLang()][key];
    }

    function applyAuthLang() {
      const lang = getLang();
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.dataset.i18n;
        const value = AUTH_I18N[lang][key];
        if (value !== undefined) el.textContent = value;
      });
      const langJaBtn = document.getElementById('lang-ja');
      const langEnBtn = document.getElementById('lang-en');
      if (langJaBtn) langJaBtn.classList.toggle('active', lang === 'ja');
      if (langEnBtn) langEnBtn.classList.toggle('active', lang === 'en');
    }

    const SUPABASE_URL = window.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
    const { createClient } = supabase;

    // ✅ ログイン維持のための設定
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: localStorage,
      }
    });

    // パスワード強度チェック
    function validatePassword(pw) {
      const lengthOK = pw.length >= 8;
      const hasUpper  = /[A-Z]/.test(pw);
      const hasLower  = /[a-z]/.test(pw);
      const hasNumber = /[0-9]/.test(pw);
      const hasSymbol = /[^A-Za-z0-9]/.test(pw);
      return {
        ok: lengthOK && hasUpper && hasLower && hasNumber && hasSymbol,
        lengthOK, hasUpper, hasLower, hasNumber, hasSymbol
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signup-form');
      const emailInput = document.getElementById('email');
      const pwInput = document.getElementById('password');
      const pwConfirmInput = document.getElementById('passwordConfirm');
      const pwConfirmHint = document.getElementById('pw-confirm-hint');

      const nationalitySelect = document.getElementById('nationality');
      const errorBox = document.getElementById('error-message');
      const successBox = document.getElementById('success-message');
      const pwHint = document.getElementById('pw-hint');
      const submitBtn = document.getElementById('submit-btn');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const togglePasswordConfirmBtn = document.getElementById('toggle-password-confirm');

      document.getElementById("link-login").href = window.APP_BASE_URL + "/index.html";

      applyAuthLang();
      const langJaBtn = document.getElementById('lang-ja');
      const langEnBtn = document.getElementById('lang-en');
      if (langJaBtn) langJaBtn.addEventListener('click', () => { localStorage.setItem(LANG_STORAGE_KEY, 'ja'); applyAuthLang(); });
      if (langEnBtn) langEnBtn.addEventListener('click', () => { localStorage.setItem(LANG_STORAGE_KEY, 'en'); applyAuthLang(); });

      // パスワード表示・非表示の切り替え
      togglePasswordBtn.addEventListener('click', () => {
        if (pwInput.type === 'password') {
          pwInput.type = 'text';
          togglePasswordBtn.textContent = '🙈';
          togglePasswordBtn.setAttribute('aria-label', t('pw-hide'));
        } else {
          pwInput.type = 'password';
          togglePasswordBtn.textContent = '👁️';
          togglePasswordBtn.setAttribute('aria-label', t('pw-show'));
        }
      });

      togglePasswordConfirmBtn.addEventListener('click', () => {
        if (pwConfirmInput.type === 'password') {
          pwConfirmInput.type = 'text';
          togglePasswordConfirmBtn.textContent = '🙈';
          togglePasswordConfirmBtn.setAttribute('aria-label', t('pw-hide'));
        } else {
          pwConfirmInput.type = 'password';
          togglePasswordConfirmBtn.textContent = '👁️';
          togglePasswordConfirmBtn.setAttribute('aria-label', t('pw-show'));
        }
      });

      // ✅ パスワード強度ヒント
      pwInput.addEventListener('input', () => {
        const pw = pwInput.value;
        const r = validatePassword(pw);

        if (!pw) {
          pwHint.textContent = "";
          return;
        }

        if (r.ok) {
          pwHint.textContent = t('pw-ok');
          pwHint.style.color = "#28a745";
        } else {
          let msgs = [];
          if (!r.lengthOK) msgs.push(t('pw-lengthOK'));
          if (!r.hasUpper) msgs.push(t('pw-hasUpper'));
          if (!r.hasLower) msgs.push(t('pw-hasLower'));
          if (!r.hasNumber) msgs.push(t('pw-hasNumber'));
          if (!r.hasSymbol) msgs.push(t('pw-hasSymbol'));
          pwHint.textContent = t('pw-missing-prefix') + msgs.join("・");
          pwHint.style.color = "#d9534f";
        }
      });

      // ✅ 確認用パスワード一致チェック表示
      function updatePwConfirmHint() {
        const pw = pwInput.value;
        const pw2 = pwConfirmInput.value;

        if (!pw2) {
          pwConfirmHint.textContent = "";
          return;
        }

        if (pw === pw2) {
          pwConfirmHint.textContent = t('pw-confirm-match');
          pwConfirmHint.style.color = "#28a745";
        } else {
          pwConfirmHint.textContent = t('pw-confirm-mismatch');
          pwConfirmHint.style.color = "#d9534f";
        }
      }
      pwInput.addEventListener('input', updatePwConfirmHint);
      pwConfirmInput.addEventListener('input', updatePwConfirmHint);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.textContent = "";
        successBox.textContent = "";

        const email = emailInput.value.trim();
        const password = pwInput.value;
        const passwordConfirm = pwConfirmInput.value;
        const nationality = nationalitySelect.value;

        if (!email || !password) {
          errorBox.textContent = t('err-required');
          return;
        }

        if (password !== passwordConfirm) {
          errorBox.textContent = t('err-pw-mismatch');
          return;
        }

        const check = validatePassword(password);
        if (!check.ok) {
          errorBox.textContent = t('err-pw-weak');
          return;
        }

        submitBtn.disabled = true;

        try {
          // 1) Supabase Auth ユーザー作成
          const { data, error } = await supabaseClient.auth.signUp({ email, password });

          if (error) {
            console.error("signUp error", error);
            errorBox.textContent = t('err-signup-failed') + error.message;
            return;
          }

          const user = data.user;
          if (!user) {
            errorBox.textContent = t('err-no-user');
            return;
          }

          // 2) profiles にレコード作成
          const { error: profileError } = await supabaseClient
            .from('profiles')
            .insert({
              id: user.id,
              email: email,
              nationality: nationality || null,
              role: 'user'
            });

          if (profileError) {
            console.error("profiles insert error", profileError);
            errorBox.textContent = t('err-profile-failed');
            return;
          }

          // ✅ 登録後もログインしたままにする
          const { data: sessionData } = await supabaseClient.auth.getSession();

          if (!sessionData.session) {
            const { error: signInError } = await supabaseClient.auth.signInWithPassword({
              email, password
            });

            if (signInError) {
              errorBox.textContent = t('err-autologin-failed') + signInError.message;
              return;
            }
          }

          // ✅ 成功したので一覧へ
          location.href = window.APP_BASE_URL + "/contents.html";
          return;

        } catch (e2) {
          console.error(e2);
          errorBox.textContent = t('err-unknown');
        } finally {
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</head>

<body>
  <div class="top-bar">
    <div class="lang-toggle" id="lang-toggle">
      <button id="lang-ja" type="button" class="active">日本語</button>
      <button id="lang-en" type="button">English</button>
    </div>
  </div>
  <div class="card">
    <h1 data-i18n="h1">新規登録</h1>
    <p class="sub" data-i18n="sub">Liberty Bookkeeping Trainer を利用するためのアカウントを作成します。</p>

    <form id="signup-form">
      <div class="form-group">
        <label for="email" data-i18n="label-email">メールアドレス</label>
        <input id="email" type="email" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password" data-i18n="label-password">パスワード</label>
        <div class="password-wrapper">
          <input id="password" type="password" required autocomplete="new-password" />
          <button type="button" class="toggle-password" id="toggle-password" aria-label="パスワードを表示">👁️</button>
        </div>
        <div class="helper" data-i18n="pw-helper">
          条件：8文字以上・英大文字・英小文字・数字・記号を各1文字以上含めてください。
        </div>
        <div id="pw-hint" class="helper"></div>
      </div>

      <div class="form-group">
        <label for="passwordConfirm" data-i18n="label-password-confirm">パスワード（確認）</label>
        <div class="password-wrapper">
          <input id="passwordConfirm" type="password" required autocomplete="new-password" />
          <button type="button" class="toggle-password" id="toggle-password-confirm" aria-label="パスワードを表示">👁️</button>
        </div>
        <div id="pw-confirm-hint" class="helper"></div>
      </div>

      <div class="form-group">
        <label for="nationality" data-i18n="label-nationality">国籍（任意）</label>
        <select id="nationality">
          <option value="JP">Japan / 日本</option>
          <option value="CN">China / 中国</option>
          <option value="VN">Vietnam / ベトナム</option>
          <option value="KR">Korea / 韓国</option>
          <option value="PH">Philippines / フィリピン</option>
          <option value="NP">Nepal / ネパール</option>
          <option value="ID">Indonesia / インドネシア</option>
          <option value="MM">Myanmar / ミャンマー</option>
          <option value="TW">Taiwan / 台湾</option>
          <option value="LK">Sri Lanka / スリランカ</option>
          <option value="BD">Bangladesh / バングラデシュ</option>
          <option value="TH">Thailand / タイ</option>
          <option value="MN">Mongolia / モンゴル</option>
          <option value="MY">Malaysia / マレーシア</option>
          <option value="KH">Cambodia / カンボジア</option>
          <option value="IN">India / インド</option>
          <option value="PK">Pakistan / パキスタン</option>
          <option value="UZ">Uzbekistan / ウズベキスタン</option>
          <option value="HK">Hong Kong / 香港</option>
          <option value="SG">Singapore / シンガポール</option>
          <option value="BR">Brazil / ブラジル</option>
          <option value="US">United States / アメリカ合衆国</option>
          <option value="PE">Peru / ペルー</option>
          <option value="CA">Canada / カナダ</option>
          <option value="MX">Mexico / メキシコ</option>
          <option value="BO">Bolivia / ボリビア</option>
          <option value="GB">United Kingdom / イギリス</option>
          <option value="FR">France / フランス</option>
          <option value="DE">Germany / ドイツ</option>
          <option value="IT">Italy / イタリア</option>
          <option value="ES">Spain / スペイン</option>
          <option value="RU">Russia / ロシア</option>
          <option value="UA">Ukraine / ウクライナ</option>
          <option value="AU">Australia / オーストラリア</option>
          <option value="NZ">New Zealand / ニュージーランド</option>
          <option value="TR">Turkey / トルコ</option>
          <option value="IR">Iran / イラン</option>
          <option value="NG">Nigeria / ナイジェリア</option>
          <option value="GH">Ghana / ガーナ</option>
          <option value="EG">Egypt / エジプト</option>
        </select>
        <div class="helper" data-i18n="nationality-helper">任意項目です。留学生の分析などに利用します。</div>
      </div>

      <div id="error-message" class="error"></div>
      <div id="success-message" class="success"></div>

      <button id="submit-btn" type="submit" class="btn btn-primary" data-i18n="submit">
        アカウントを作成する
      </button>
    </form>

    <div class="footer-link">
      <span data-i18n="footer-have-account">すでにアカウントをお持ちの方は</span> <a id="link-login" href="index.html" data-i18n="footer-login-link">ログイン画面へ</a>
    </div>
  </div>
  <script src="page-controls.js?v=20260809-2"></script>
</body>
</html>
