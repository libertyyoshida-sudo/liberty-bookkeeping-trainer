<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>パスワード再設定 | Liberty Bookkeeping Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg-main: #f5f7fb;
      --bg-card: #ffffff;
      --primary: #005bac;
      --accent: #00a0e9;
      --text-main: #222;
      --text-muted: #666;
      --danger: #d9534f;
      --success: #28a745;
      --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.06);
      --radius-xl: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top left, #e6f0ff, #f5f7fb 40%, #ffffff 80%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 24px 22px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(0,0,0,0.03);
    }
    h1 {
      font-size: 1.3rem;
      margin: 0 0 4px;
      color: var(--primary);
      text-align: center;
    }
    p.sub {
      margin: 0 0 18px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--text-main);
    }
    input[type="email"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px; /* iOSズーム抑止 */
      border-radius: 8px;
      border: 1px solid #dde3f0;
      outline: none;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 91, 172, 0.18);
    }
    .btn {
      width: 100%;
      border-radius: 999px;
      border: none;
      padding: 10px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      margin-top: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 91, 172, 0.35);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }
    .error {
      font-size: 0.85rem;
      color: var(--danger);
      margin-top: 8px;
      min-height: 1.2em;
      line-height: 1.4;
    }
    .success {
      font-size: 0.85rem;
      color: var(--success);
      margin-top: 8px;
      min-height: 1.2em;
      line-height: 1.4;
    }
    .footer-link {
      margin-top: 14px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .footer-link a {
      color: var(--primary);
      text-decoration: none;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 1200;
      display: flex;
      justify-content: flex-end;
      padding: 8px 16px;
      width: 100%;
    }
    .lang-toggle {
      display: inline-flex;
      border-radius: 999px;
      padding: 2px;
      background: var(--primary-soft, #e2eef9);
    }
    .lang-toggle button {
      border: none;
      padding: 4px 10px;
      border-radius: 999px;
      background: transparent;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
    }
    .lang-toggle button.active {
      background: #fff;
      color: var(--primary);
      font-weight: 600;
      box-shadow: 0 0 0 1px rgba(0, 91, 172, 0.06);
    }
  </style>

  <!-- ✅ config.js を先に読み込む -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const LANG_STORAGE_KEY = 'liberty-lang';
    const AUTH_I18N = {
      ja: {
        h1: 'パスワード再設定',
        sub: '登録済みのメールアドレスを入力してください。',
        'label-email': 'メールアドレス',
        submit: '再設定用メールを送信する',
        'footer-back': 'ログイン画面に戻る →',
        'footer-login-link': 'ログイン',
        'err-required': 'メールアドレスを入力してください。',
        'err-send-failed': 'メール送信に失敗しました: ',
        'msg-sent': 'パスワード再設定用のメールを送信しました。メールをご確認ください。5～10分ほどかかる場合があります。',
        'err-unknown': '不明なエラーが発生しました。'
      },
      en: {
        h1: 'Reset Password',
        sub: 'Enter your registered email address.',
        'label-email': 'Email address',
        submit: 'Send reset email',
        'footer-back': 'Back to login →',
        'footer-login-link': 'Login',
        'err-required': 'Please enter your email address.',
        'err-send-failed': 'Failed to send email: ',
        'msg-sent': 'A password reset email has been sent. Please check your inbox (it may take 5–10 minutes).',
        'err-unknown': 'An unknown error occurred.'
      }
    };

    function getLang() {
      const saved = localStorage.getItem(LANG_STORAGE_KEY);
      return saved === 'en' ? 'en' : 'ja';
    }

    function t(key) {
      return AUTH_I18N[getLang()][key];
    }

    function applyAuthLang() {
      const lang = getLang();
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.dataset.i18n;
        const value = AUTH_I18N[lang][key];
        if (value !== undefined) el.textContent = value;
      });
      const langJaBtn = document.getElementById('lang-ja');
      const langEnBtn = document.getElementById('lang-en');
      if (langJaBtn) langJaBtn.classList.toggle('active', lang === 'ja');
      if (langEnBtn) langEnBtn.classList.toggle('active', lang === 'en');
    }

    // ✅ supabase client（安定設定付き）
    const supabaseClient = supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storage: localStorage,
        }
      }
    );

    window.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const emailInput = document.getElementById('email');
      const errorBox = document.getElementById('error-message');
      const successBox = document.getElementById('success-message');
      const submitBtn = document.getElementById('submit-btn');

      // ✅ ログインリンクを config.js で統一
      document.getElementById("link-login").href = window.APP_BASE_URL + "/index.html";

      applyAuthLang();
      const langJaBtn = document.getElementById('lang-ja');
      const langEnBtn = document.getElementById('lang-en');
      if (langJaBtn) langJaBtn.addEventListener('click', () => { localStorage.setItem(LANG_STORAGE_KEY, 'ja'); applyAuthLang(); });
      if (langEnBtn) langEnBtn.addEventListener('click', () => { localStorage.setItem(LANG_STORAGE_KEY, 'en'); applyAuthLang(); });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.textContent = "";
        successBox.textContent = "";

        const email = emailInput.value.trim();
        if (!email) {
          errorBox.textContent = t('err-required');
          return;
        }

        submitBtn.disabled = true;

        try {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.APP_BASE_URL + "/reset-password.html"
          });

          if (error) {
            console.error("resetPasswordForEmail error", error);
            errorBox.textContent = t('err-send-failed') + error.message;
          } else {
            successBox.textContent = t('msg-sent');
            form.reset();
          }
        } catch (e2) {
          console.error(e2);
          errorBox.textContent = t('err-unknown');
        } finally {
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</head>

<body>
  <div class="top-bar">
    <div class="lang-toggle" id="lang-toggle">
      <button id="lang-ja" type="button" class="active">日本語</button>
      <button id="lang-en" type="button">English</button>
    </div>
  </div>
  <div class="card">
    <h1 data-i18n="h1">パスワード再設定</h1>
    <p class="sub" data-i18n="sub">登録済みのメールアドレスを入力してください。</p>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email" data-i18n="label-email">メールアドレス</label>
        <input id="email" type="email" required autocomplete="email" />
      </div>

      <div id="error-message" class="error"></div>
      <div id="success-message" class="success"></div>

      <button id="submit-btn" type="submit" class="btn btn-primary" data-i18n="submit">
        再設定用メールを送信する
      </button>
    </form>

    <div class="footer-link">
      <span data-i18n="footer-back">ログイン画面に戻る →</span> <a id="link-login" href="index.html" data-i18n="footer-login-link">ログイン</a>
    </div>
  </div>
  <script src="page-controls.js?v=20260809-2"></script>
</body>
</html>
